# Nightly Drive -> knowledge base sync, run by GitHub for free.
# Scheduled runs only fire from the default branch (main).
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL, OPENAI_API_KEY, GOOGLE_SERVICE_ACCOUNT_JSON (the whole JSON file), GOOGLE_DRIVE_FOLDER_ID
name: Nightly contract sync

on:
  schedule:
    - cron: "0 23 * * *" # 23:00 UTC = 02:00 Israel (winter), 01:00 in summer
  workflow_dispatch: {} # "Run workflow" button for a manual sync

concurrency:
  group: contract-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Hebrew OCR (local and free, before any vision model)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-heb tesseract-ocr-eng

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Drive folder
        env:
          PYTHONIOENCODING: utf-8
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FOLDER_PATH: MITVE TOOLS/NECHASIM/CONTRACTS
        run: python -m app.jobs.sync nightly
