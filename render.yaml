# Render Blueprint, free plan (no credit card).
#   Database: Neon (free Postgres + pgvector, data is kept) - paste its connection string as DATABASE_URL.
#   Nightly sync: GitHub Actions (.github/workflows/nightly-sync.yml), not a Render cron.
# Free services sleep after ~15 minutes without traffic; the first visit after that takes ~30-60 seconds.
# The paid setup (Render Postgres + cron, always on) is in render.paid.yaml.
#
# The Google service account JSON goes in as a Secret File named service_account.json on contracts-api
# (it is read from /etc/secrets/service_account.json).

services:
  - type: web
    name: contracts-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL # Neon direct connection string (not the -pooler one)
        sync: false
      - key: API_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_PATH
        value: MITVE TOOLS/NECHASIM/CONTRACTS
      - key: CORS_ORIGINS
        value: https://contracts-web.onrender.com
      - key: DAILY_TOKEN_BUDGET
        value: "2000000"

  - type: web
    name: contracts-web
    runtime: node
    rootDir: frontend
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_URL
        fromService:
          type: web
          name: contracts-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: BACKEND_API_KEY
        fromService:
          type: web
          name: contracts-api
          envVarKey: API_KEY
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
